name: BT Kite APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract BT Kite Source
        run: |
          unzip -o bt-kite.zip -d source

      - name: Find Android Project
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            echo "Please check if Android source is included in bt-kite.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          chmod +x "$GRADLEW"

          echo "Android project found at: $PROJECT_DIR"

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BT-Kite-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
