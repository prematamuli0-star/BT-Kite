name: BT Kite APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract BT Kite Source
        run: |
          unzip -o bt-kite.zip -d source

      - name: Build BT Kite Release APK
        run: |
          cd source/android-app
          gradle assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BT-Kite-Release-APK
          path: source/android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
